# ═══════════════════════════════════════════════════════════════
#  NETLIFY CONFIG — Ayuda Venezuela PWA
#  - Serverless Functions en /netlify/functions/
#  - Headers de seguridad y caché para PWA
#  - CORS para las funciones del API
# ═══════════════════════════════════════════════════════════════

[build]
  publish = "."
  functions = "netlify/functions"

# ── Seguridad y caché para archivos estáticos ──────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(self), camera=(self), microphone=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type  = "application/javascript"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type  = "application/manifest+json"

[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ── Redirects: SPA fallback + API routing ──────────────────────
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# Cada idioma tiene su propia carpeta con su propio index.html —
# estas reglas DEBEN ir antes del catch-all de abajo, o Netlify
# siempre sirve el index.html de la raíz para /en/, /fr/, /de/, /pt/
# (que es exactamente lo que estaba pasando).
[[redirects]]
  from   = "/en/*"
  to     = "/en/index.html"
  status = 200

[[redirects]]
  from   = "/fr/*"
  to     = "/fr/index.html"
  status = 200

[[redirects]]
  from   = "/de/*"
  to     = "/de/index.html"
  status = 200

[[redirects]]
  from   = "/pt/*"
  to     = "/pt/index.html"
  status = 200

# Catch-all para la raíz (español, por defecto) — debe ir al final,
# ya que solo aplica a lo que ninguna regla anterior haya capturado.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

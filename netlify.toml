# ═══════════════════════════════════════════════════════════════
#  NETLIFY CONFIG — Ayuda Venezuela PWA
#  - Serverless Functions en /netlify/functions/
#  - Headers de seguridad y caché para PWA
#  - CORS para las funciones del API
# ═══════════════════════════════════════════════════════════════

[build]
  publish = "."
  functions = "netlify/functions"

# ── Seguridad y caché para archivos estáticos ──────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(self), camera=(self), microphone=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type  = "application/javascript"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type  = "application/manifest+json"

[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ── Redirects: SPA fallback + API routing ──────────────────────
# Consolidado a una sola fuente de verdad (día 29): el multiidioma
# ahora vive dentro de index.html + emergency-data.js, seleccionado
# vía ?lang= o el selector en el header — no vía carpetas separadas.
# Las carpetas /en/, /fr/, /de/, /pt/ se eliminaron del repo.
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
